apiVersion: apps/v1
kind: Deployment
metadata:
  name: percona-server-mongodb-operator
  labels:
    name: percona-server-mongodb-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/instance: percona-server-mongodb-operator
    app.kubernetes.io/name: percona-server-mongodb-operator
    app.kubernetes.io/part-of: percona-server-mongodb-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      name: percona-server-mongodb-operator
  template:
    metadata:
      labels:
        name: percona-server-mongodb-operator
        app.kubernetes.io/component: operator
        app.kubernetes.io/instance: percona-server-mongodb-operator
        app.kubernetes.io/name: percona-server-mongodb-operator
        app.kubernetes.io/part-of: percona-server-mongodb-operator
    spec:
      serviceAccountName: percona-server-mongodb-operator
      containers:
        - name: percona-server-mongodb-operator
          image: percona/percona-server-mongodb-operator:1.22.0
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
          ports:
          - containerPort: 8080
            protocol: TCP
            name: metrics
          command:
          - percona-server-mongodb-operator
          env:
            - name: LOG_STRUCTURED
              value: 'false'
            - name: LOG_LEVEL
              value: INFO
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: percona-server-mongodb-operator
            - name: RESYNC_PERIOD
              value: 5s
            - name: DISABLE_TELEMETRY
              value: "false"
            - name: MAX_CONCURRENT_RECONCILES
              value: "1"
            # REPLSET_RECONCILE_CONCURRENCY bounds how many replsets of a single
            # cluster are reconciled in parallel. Default 8. Set to "1" to restore
            # fully sequential reconciliation.
            - name: REPLSET_RECONCILE_CONCURRENCY
              value: "8"
            # SHARD_ADD_CONCURRENCY bounds concurrent sh.addShard calls. MongoDB
            # serializes shard addition through the config server's DDL coordinator,
            # so this is clamped to 1-3. Default 1.
            - name: SHARD_ADD_CONCURRENCY
              value: "1"
